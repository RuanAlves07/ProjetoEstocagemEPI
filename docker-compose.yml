services:
  estoque-epi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: estoque_epis
    # Reinicia automaticamente em caso de falha ou reinicialização do sistema operacional, a menos que seja parado manualmente
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      # Persistência de dados: armazena epi.sqlite, chaves e arquivos na pasta local ./instance
      # Os dados não são perdidos ao reiniciar, atualizar ou recriar o container
      - ./instance:/app/instance
    env_file:
      - path: .env
        required: false
    environment:
      - TZ=${TZ:-America/Sao_Paulo}
      - EPI_SECRET_KEY=${EPI_SECRET_KEY:-}
      - DATABASE_URL=${DATABASE_URL:-}
