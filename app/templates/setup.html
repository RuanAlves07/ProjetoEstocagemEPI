{% extends 'base.html' %}
{% from '_macros.html' import csrf with context %}
{% block titulo %}Configuração inicial{% endblock %}
{% block conteudo %}
<div class="cartao">
  <h1>Configuração inicial</h1>
  <p>Crie o primeiro usuário <strong>administrador</strong>. Depois você poderá cadastrar os demais usuários.</p>
  <form method="post" class="formulario">
    {{ csrf() }}
    <label>Nome <input name="nome" required autofocus value="{{ request.form.nome }}"></label>
    <label>Login <input name="login" required autocomplete="username" value="{{ request.form.login }}"></label>
    <label>Senha (mín. 8 caracteres) <input name="senha" type="password" required minlength="8" autocomplete="new-password"></label>
    <label>Confirmar senha <input name="confirmacao" type="password" required minlength="8" autocomplete="new-password"></label>
    <button class="btn primario">Criar administrador</button>
  </form>
</div>
{% endblock %}
